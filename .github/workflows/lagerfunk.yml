# Lagerfunk monitor + Telegram bot on GitHub Actions. EUR 0: this repository must be PUBLIC, because standard
# GitHub-hosted runners are free and unlimited for public repositories (a private repository on the Free plan gets 2,000
# minutes a month, and this schedule needs about 5,000). See deploy/README.md for the arithmetic and the limits.
#
# The clock is NOT the cron. GitHub's scheduler drops and delays scheduled runs under load (4 of about 48 arrived in one
# night), so one run stays alive for about 50 minutes, does a cycle every 10 minutes, and starts the next run itself
# (deploy/loop.mjs, rules in deploy/lib/chain.mjs, numbers in deploy/config/breakers.json "chain"). The cron below is only the
# safety net that restarts the chain if it ever breaks. A run that finds the chain alive does not start a second one.
#
# Every action is pinned to a full commit SHA (the version is in the comment), because this job holds the Telegram bot
# token and a moving tag could run changed code with it. Same pins as the private agency repository's CI.
#
# Production runs the code at the tag last-known-good, not whatever is newest on main. The smoke workflow moves that
# tag only after a change passed (fail closed). Rollback = move the tag back (ops workflow, action "rollback").
# Until the first smoke test passes there is no tag, and main runs.
name: lagerfunk

on:
  schedule:
    # Safety net: restarts the chain if it ever breaks. A run that starts while the chain is alive waits in the concurrency
    # group and takes over when the chain's run ends, so it never doubles the checks. Minutes are offset away from :00,
    # the start of the hour is when GitHub is busiest and scheduled jobs get delayed or dropped.
    - cron: '4,14,24,34,44,54 * * * *'
    - cron: '29 * * * *'
  # Right after every passing smoke test, so a new version starts working at once: the running chain notices the queued
  # run, ends after its current cycle and lets it take over.
  workflow_run:
    workflows: [lagerfunk-smoke]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [watch, feeds, all, status]
        default: all
      dry_run:
        description: 'Dry run: check, print, post nothing, save nothing'
        type: boolean
        default: false
      silent:
        description: 'Learn only: check and save state, post nothing (use for the very first run)'
        type: boolean
        default: false
      force:
        description: 'Download feeds even if one was fetched recently'
        type: boolean
        default: false
      release_held:
        description: 'Post the posts a circuit breaker held (only those under an hour old)'
        type: boolean
        default: false
      chain:
        description: 'Start the chain: keep running for about 50 minutes and hand over to the next run (what the cron does). Off = one cycle of the chosen mode, then make sure a chain exists'
        type: boolean
        default: false

# The job token may push the "state" branch (contents) and list, start and cancel runs of this workflow (actions): the loop starts
# the next run with it. A workflow_dispatch made with the job token DOES start a run (the documented exception).
permissions:
  contents: write
  actions: write

# One run at a time, and a run that is waiting never cancels the one that is running (no cancel-in-progress): the chain
# run keeps its cycles, the next run starts when it ends. Of several waiting runs only the newest is kept.
concurrency:
  group: lagerfunk
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, two days before the public launch
    timeout-minutes: 58 # loop 50 + hand-over lead + start-up, under the hour; breakers.json "chain" is checked against this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Use the last known good version
        run: |
          echo "MAIN_COMMIT_TS=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if git fetch --quiet --no-tags --depth=1 origin +refs/tags/last-known-good:refs/tags/last-known-good 2>/dev/null; then
            git -c advice.detachedHead=false checkout --quiet --detach last-known-good
          else
            echo "::notice::no last-known-good tag yet (no smoke test has passed): running main"
          fi
          echo "CODE_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: Run
        # An older tag (a rollback) has no loop.mjs: it then runs one plain cycle, as before the chain.
        run: |
          if [ -f deploy/loop.mjs ]; then exec node deploy/loop.mjs; fi
          echo "::notice::this version has no deploy/loop.mjs: one plain cycle, no chain"
          exec node deploy/run.mjs
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '29 * * * *' && 'feeds' || 'watch') }}
          DRY_RUN: ${{ inputs.dry_run }}
          SILENT: ${{ inputs.silent }}
          FORCE: ${{ inputs.force }}
          RELEASE_HELD: ${{ inputs.release_held }}
          # The chain: loop.mjs lists, starts and reads this workflow's runs with the job token. A manual run without "chain" is one cycle.
          CHAIN: ${{ inputs.chain }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROFILE: free
          # Where posts go: "staging" (the private test channel, the default until promoted) or "public".
          LAGERFUNK_CHANNEL: ${{ vars.LAGERFUNK_CHANNEL || 'staging' }}
          # 1 (or true, yes, on) here holds every post (checks go on). For incidents: Settings, Variables, LAGERFUNK_PAUSE = 1.
          LAGERFUNK_PAUSE: ${{ vars.LAGERFUNK_PAUSE }}
          # Telegram. FREE_CHAT_ID, BRAND and the links default to brand.json (@lagerfunk).
          # Legal links in the channel texts default to <siteUrl>/impressum and /datenschutz from brand.json. Variables, only needed to override (for example ".html" addresses).
          IMPRESSUM_URL: ${{ vars.IMPRESSUM_URL }}
          DATENSCHUTZ_URL: ${{ vars.DATENSCHUTZ_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_STAGING: ${{ secrets.TELEGRAM_CHAT_ID_STAGING }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          # Affiliate. AWIN_MIDS looks like "proshop=18501,cyberport=11657". Feed links are already tracked.
          AWIN_AFFILIATE_ID: ${{ secrets.AWIN_AFFILIATE_ID }}
          AWIN_MIDS: ${{ secrets.AWIN_MIDS }}
          TRADEDOUBLER_SITE_ID: ${{ secrets.TRADEDOUBLER_SITE_ID }}
          # Product feeds: a feed is on as soon as its secret exists.
          FEED_URL_PROSHOP: ${{ secrets.FEED_URL_PROSHOP }}
          FEED_URL_COMPUTERUNIVERSE: ${{ secrets.FEED_URL_COMPUTERUNIVERSE }}
          FEED_URL_CYBERPORT: ${{ secrets.FEED_URL_CYBERPORT }}
          FEED_URL_CASEKING: ${{ secrets.FEED_URL_CASEKING }}
          FEED_URL_ALTERNATE: ${{ secrets.FEED_URL_ALTERNATE }}
          FEED_URL_GALAXUS: ${{ secrets.FEED_URL_GALAXUS }}
          FEED_FORMAT_CYBERPORT: ${{ vars.FEED_FORMAT_CYBERPORT }}
          FEED_FORMAT_PROSHOP: ${{ vars.FEED_FORMAT_PROSHOP }}
          FEED_FORMAT_COMPUTERUNIVERSE: ${{ vars.FEED_FORMAT_COMPUTERUNIVERSE }}
          FEED_FORMAT_CASEKING: ${{ vars.FEED_FORMAT_CASEKING }}
          FEED_FORMAT_ALTERNATE: ${{ vars.FEED_FORMAT_ALTERNATE }}
          AWIN_PUBLISHER_ID: ${{ vars.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
      - name: Keep the state if saving failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lagerfunk-state-${{ github.run_id }}
          path: deploy/out/
          retention-days: 7
          if-no-files-found: ignore
