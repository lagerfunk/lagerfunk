# Lagerfunk monitor + Telegram bot on GitHub Actions. EUR 0: this repository must be PUBLIC, because standard
# GitHub-hosted runners are free and unlimited for public repositories (a private repository on the Free plan gets 2,000
# minutes a month, and this schedule needs about 5,000). See deploy/README.md for the arithmetic and the limits.
#
# Every action is pinned to a full commit SHA (the version is in the comment), because this job holds the Telegram bot
# token and a moving tag could run changed code with it. Same pins as the private agency repository's CI.
#
# Production runs the code at the tag last-known-good, not whatever is newest on main. The smoke workflow moves that
# tag only after a change passed (fail closed). Rollback = move the tag back (ops workflow, action "rollback").
# Until the first smoke test passes there is no tag, and main runs.
name: lagerfunk

on:
  schedule:
    # PS5 list and every shop that answers without a proxy: every 10 minutes. Minutes are offset away from :00,
    # the start of the hour is when GitHub is busiest and scheduled jobs get delayed or dropped.
    - cron: '4,14,24,34,44,54 * * * *'
    # Product feeds (Proshop, Cyberport, computeruniverse, Galaxus): once an hour, at :29.
    - cron: '29 * * * *'
  # Run once right after every passing smoke test, so a new version starts working at once
  # (and the first run happens even before GitHub's scheduler picks the cron up).
  workflow_run:
    workflows: [lagerfunk-smoke]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [watch, feeds, all, status]
        default: all
      dry_run:
        description: 'Dry run: check, print, post nothing, save nothing'
        type: boolean
        default: false
      silent:
        description: 'Learn only: check and save state, post nothing (use for the very first run)'
        type: boolean
        default: false
      force:
        description: 'Download feeds even if one was fetched recently'
        type: boolean
        default: false
      release_held:
        description: 'Post the posts a circuit breaker held (only those under an hour old)'
        type: boolean
        default: false

# The job token may push the "state" branch and nothing else.
permissions:
  contents: write

# One run at a time. A run that waits is replaced by a newer one, which is what we want for a poller.
concurrency:
  group: lagerfunk
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Use the last known good version
        run: |
          echo "MAIN_COMMIT_TS=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if git fetch --quiet --no-tags --depth=1 origin +refs/tags/last-known-good:refs/tags/last-known-good 2>/dev/null; then
            git -c advice.detachedHead=false checkout --quiet --detach last-known-good
          else
            echo "::notice::no last-known-good tag yet (no smoke test has passed): running main"
          fi
          echo "CODE_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: Run
        run: node deploy/run.mjs
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '29 * * * *' && 'feeds' || 'watch') }}
          DRY_RUN: ${{ inputs.dry_run }}
          SILENT: ${{ inputs.silent }}
          FORCE: ${{ inputs.force }}
          RELEASE_HELD: ${{ inputs.release_held }}
          PROFILE: free
          # Where posts go: "staging" (the private test channel, the default until promoted) or "public".
          LAGERFUNK_CHANNEL: ${{ vars.LAGERFUNK_CHANNEL || 'staging' }}
          # Any value here holds every post (checks go on). For incidents: Settings, Variables, LAGERFUNK_PAUSE = 1.
          LAGERFUNK_PAUSE: ${{ vars.LAGERFUNK_PAUSE }}
          # Telegram. FREE_CHAT_ID, BRAND and the links default to brand.json (@lagerfunk).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_STAGING: ${{ secrets.TELEGRAM_CHAT_ID_STAGING }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          # Affiliate. AWIN_MIDS looks like "proshop=18501,cyberport=11657". Feed links are already tracked.
          AWIN_AFFILIATE_ID: ${{ secrets.AWIN_AFFILIATE_ID }}
          AWIN_MIDS: ${{ secrets.AWIN_MIDS }}
          TRADEDOUBLER_SITE_ID: ${{ secrets.TRADEDOUBLER_SITE_ID }}
          # Product feeds: a feed is on as soon as its secret exists.
          FEED_URL_PROSHOP: ${{ secrets.FEED_URL_PROSHOP }}
          FEED_URL_COMPUTERUNIVERSE: ${{ secrets.FEED_URL_COMPUTERUNIVERSE }}
          FEED_URL_CYBERPORT: ${{ secrets.FEED_URL_CYBERPORT }}
          FEED_URL_CASEKING: ${{ secrets.FEED_URL_CASEKING }}
          FEED_URL_ALTERNATE: ${{ secrets.FEED_URL_ALTERNATE }}
          FEED_URL_GALAXUS: ${{ secrets.FEED_URL_GALAXUS }}
          FEED_FORMAT_CYBERPORT: ${{ vars.FEED_FORMAT_CYBERPORT }}
          FEED_FORMAT_PROSHOP: ${{ vars.FEED_FORMAT_PROSHOP }}
          FEED_FORMAT_COMPUTERUNIVERSE: ${{ vars.FEED_FORMAT_COMPUTERUNIVERSE }}
          FEED_FORMAT_CASEKING: ${{ vars.FEED_FORMAT_CASEKING }}
          FEED_FORMAT_ALTERNATE: ${{ vars.FEED_FORMAT_ALTERNATE }}
          AWIN_PUBLISHER_ID: ${{ vars.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
      - name: Keep the state if saving failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lagerfunk-state-${{ github.run_id }}
          path: deploy/out/
          retention-days: 7
          if-no-files-found: ignore
