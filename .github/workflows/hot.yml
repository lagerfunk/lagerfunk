# Hot watcher, RTX 5090 only: the Founders Edition at NVIDIA and ALTERNATE's 5090 listing every 10 s each, with a price
# limit and a log of every stock drop (drops.json on the branch "drops"), for about 50 minutes per run; then
# the run starts the next one itself (deploy/hot.mjs). Alerts go ONLY to the owner's admin chat (TELEGRAM_ADMIN_CHAT_ID)
# and any chat in HOT_EXTRA_CHAT_IDS, never to the channel. Nothing is ever ordered. Models, limits, shops:
# deploy/config/hot.json. Stop: Settings, Variables, HOT_PAUSE = 1 (or disable this workflow). Start: Actions, hot, Run workflow.
#
# Runs main, not last-known-good. It writes only the "drops" branch, never the runner's "state" branch.
name: hot

on:
  schedule:
    # Safety net only: restarts the chain if it ever breaks. Offset from :00, when GitHub is busiest.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      announce:
        description: 'Send one "watcher is on" message with the last drop of every model first'
        type: boolean
        default: false

permissions:
  contents: write # the drops branch
  actions: write # start the next run

# One run at a time; a waiting run never cancels the running one.
concurrency:
  group: hot
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Watch
        run: node deploy/hot.mjs
        env:
          ANNOUNCE: ${{ inputs.announce }}
          HOT_PAUSE: ${{ vars.HOT_PAUSE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          HOT_EXTRA_CHAT_IDS: ${{ secrets.HOT_EXTRA_CHAT_IDS }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
