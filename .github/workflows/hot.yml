# Hot watcher: the RTX 5090 Founders Edition every 30 s and a few 5090 partner cards every 5 min, for about 50 minutes per
# run, then the run starts the next one itself (deploy/hot.mjs). Alerts go ONLY to the owner's private admin chat
# (TELEGRAM_ADMIN_CHAT_ID), never to the channel. Nothing is ever ordered. Products and caps: deploy/config/hot.json.
# Stop: Settings, Variables, HOT_PAUSE = 1 (or disable this workflow). Start: Actions, hot, Run workflow.
#
# Runs main, not last-known-good: it only reads shop pages and messages the owner, it does not touch the state branch.
name: hot

on:
  schedule:
    # Safety net only: restarts the chain if it ever breaks. Offset from :00, when GitHub is busiest.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      announce:
        description: 'Send one "watcher is on" message to the admin chat first'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# One run at a time; a waiting run never cancels the running one.
concurrency:
  group: hot
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Watch
        run: node deploy/hot.mjs
        env:
          ANNOUNCE: ${{ inputs.announce }}
          HOT_PAUSE: ${{ vars.HOT_PAUSE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
